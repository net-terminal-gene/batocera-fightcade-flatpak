<?xml version="1.0" encoding="UTF-8" ?>
<!--
  CRT-only Fightcade feature. install.sh copies this file next to
  es_features_fightcade.cfg only when the machine is in CRT mode (xorg, width
  under 1024, Switchres present). HD installs omit it, so VERTICAL MODE does
  not appear in Advanced Game Options.
-->
<features>
  <emulator name="flatpak" features="padtokeyboard">
    <feature name="VERTICAL MODE" value="fcvertical"
             preset="switch"
             description="CRT only. Rotates the Fightcade lobby 90 degrees for a vertical (TATE) cabinet. The ROMs / Window / Help menu rotates with the lobby. Off is the normal landscape lobby.">
    </feature>
  </emulator>
</features>
