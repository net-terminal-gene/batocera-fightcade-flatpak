<?xml version="1.0" encoding="UTF-8" ?>
<!--
  Additive EmulationStation feature file for the Fightcade Flatpak.

  Batocera merges es_features_*.cfg from /userdata/system/configs/emulationstation/
  with the system es_features.cfg (same pattern as es_features_switch.cfg). This
  file adds per-game Fightcade toggles to the flatpak emulator's Advanced
  Game Options, without editing the read-only /usr/share copy.

  preset="switch" renders a real on/off toggle (like "Launch this game at
  startup"), defaulting OFF. It writes a standard Batocera setting:
      flatpak["Fightcade.flatpak"].fcdebug = 1   (ON)
      flatpak["Fightcade.flatpak"].fcdebug =     (OFF / empty / key removed)
  which fightcade-game-hook reads at gameStart to enable verbose logging. Only
  Fightcade acts on it; other flatpak apps ignore the key.

  Batocera ES (GuiMenu::addFeatureItem) has no text-only / info preset. A
  feature is shown only if it has choices or a preset, and every preset is a
  control (switch, input, slider, file picker, ...). preset="hidden" is skipped.
  The features carry no group header. Core ES appends an uncounted "Current
  setting" line to VIDEO MODE (videomodes preset), which at 480i bleeds onto
  whatever renders directly below it; a group header there just gets clobbered
  by that line. The "close this menu, then launch from the game list, do not
  use LAUNCH here" note lives in the docs (docs/CONTROLS.md) instead.

  ES saves per-game settings only when this popup closes (its destructor). The
  in-popup LAUNCH entry runs the game *before* that save, so the gameStart hook
  reads the old value. Users must change a setting, close the popup (which
  saves it), then launch Fightcade from the game list.
-->
<features>
  <emulator name="flatpak" features="padtokeyboard">
    <feature name="FIGHTCADE DEBUG LOGGING" value="fcdebug"
             preset="switch"
             description="Saves detailed logs to /userdata/system/logs so they can be shared in a bug report. May slow gameplay, so only turn on when debugging.">
    </feature>
    <feature name="VERTICAL MODE" value="fcvertical"
             preset="switch"
             description="Rotates the Fightcade lobby 90 degrees for a vertical (TATE) cabinet. The ROMs / Window / Help menu rotates with the lobby. Off is the normal landscape lobby.">
    </feature>

    <feature name="NORMAL" group="CURSOR SPEED" value="fccursor_max"
             preset="slider"
             preset-parameters="1 40 1 20 px"
             description="Stick and D-pad cursor speed, in pixels per poll.">
    </feature>
    <feature name="SLOWDOWN" group="CURSOR SPEED" value="fccursor_slow"
             preset="slider"
             preset-parameters="0.25 5 0.25 3 px"
             description="Cursor speed while R2 is held.">
    </feature>
    <feature name="NORTH" group="EDIT LOBBY CHAT" value="fclobby_north"
             preset="input"
             description="Lobby chat macro sent when you hold R1 and press NORTH in the Fightcade lobby. Type the text to send; leave it empty to disable this slot.">
    </feature>
    <feature name="EAST" group="EDIT LOBBY CHAT" value="fclobby_east"
             preset="input"
             description="Lobby chat macro sent when you hold R1 and press EAST in the Fightcade lobby. Type the text to send; leave it empty to disable this slot.">
    </feature>
    <feature name="SOUTH" group="EDIT LOBBY CHAT" value="fclobby_south"
             preset="input"
             description="Lobby chat macro sent when you hold R1 and press SOUTH in the Fightcade lobby. Type the text to send; leave it empty to disable this slot.">
    </feature>
    <feature name="WEST" group="EDIT LOBBY CHAT" value="fclobby_west"
             preset="input"
             description="Lobby chat macro sent when you hold R1 and press WEST in the Fightcade lobby. Type the text to send; leave it empty to disable this slot.">
    </feature>
    <feature name="R2" group="EDIT LOBBY CHAT" value="fclobby_r2"
             preset="input"
             description="Lobby chat macro sent when you hold R1 and press R2 in the Fightcade lobby. Type the text to send; leave it empty to disable this slot.">
    </feature>
  </emulator>
</features>
