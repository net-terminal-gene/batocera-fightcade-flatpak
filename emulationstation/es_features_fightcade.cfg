<?xml version="1.0" encoding="UTF-8" ?>
<!--
  Additive EmulationStation feature file for the Fightcade Flatpak.

  Batocera merges es_features_*.cfg from /userdata/system/configs/emulationstation/
  with the system es_features.cfg (same pattern as es_features_switch.cfg). This
  file adds a per-game "Debug Logging" toggle to the flatpak emulator's Advanced
  Game Options, without editing the read-only /usr/share copy.

  preset="switch" renders a real on/off toggle (like "Launch this game at
  startup"), defaulting OFF. It writes a standard Batocera setting:
      flatpak["Fightcade.flatpak"].fcdebug = 1   (ON)
      flatpak["Fightcade.flatpak"].fcdebug =     (OFF / empty / key removed)
  which fightcade-game-hook reads at gameStart to enable verbose logging. Only
  Fightcade acts on it; other flatpak apps ignore the key.

  Launch caveat: ES saves per-game settings only when this popup closes (its
  destructor). The in-popup LAUNCH entry runs the game *before* that save, so the
  gameStart hook reads the old value. Users must turn the toggle ON, close the
  popup (which saves it), then launch Fightcade from the game list. The
  description below states this explicitly and lets ES wrap the text naturally.
-->
<features>
  <emulator name="flatpak" features="padtokeyboard">
    <feature name="FIGHTCADE DEBUG LOGGING" group="FIGHTCADE" value="fcdebug"
             preset="switch"
             description="Saves detailed logs to /userdata/system/logs so they can be shared in a bug report. May slow gameplay, so only turn on when debugging.&#10;&#10;IMPORTANT: turning this ON or OFF only takes effect when you launch from EmulationStation. After changing it, close this menu and launch Fightcade from the game list. Do not use the LAUNCH option in this menu.">
    </feature>
  </emulator>
</features>
