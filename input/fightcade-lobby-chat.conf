# Fightcade lobby chat config
# Hold R1 and press a slot to send that line in the Fightcade lobby (lobby only).
# Click the chat input first, then hold R1 and press the slot.
# Leave a slot empty to disable it (example: east=).
# Restart Fightcade after editing.
#
# Your copy (edit this file):
#   /userdata/system/configs/fightcade-lobby-chat.conf
#
# Shipped template (do not edit; re-install copies on first run only):
#   /userdata/system/fightcade-flatpak/input/fightcade-lobby-chat.conf

south=match
east=you quit?
west=great set!
north=rematch?
r2=ggs!
