# Fightcade pad-mouse config
# Edit your copy (restart Fightcade or pad-mouse to apply):
#   /userdata/system/configs/fightcade-pad-mouse.conf
#
# Shipped template (re-install copies on first run only):
#   /userdata/system/fightcade-flatpak/input/fightcade-pad-mouse.conf
#
# Cursor speed: pixels moved per stick poll (default 60 Hz).
#   max_speed = full stick / D-pad
#   slow_speed = same with R1 held alone (HD only; R2 on CRT)
#
# HD = Fightcade lobby + non-CRT gameplay (1080p and similar).
# CRT = Switchres active during CRT games (lower resolution).

# HD = 1080p-style installs. CRT = Switchres / sub-1024p desktop (lobby + gameplay).
# Menu speeds apply when emulator menu is open (SELECT+WEST on FBNeo/SNES).

max_speed_hd=20
slow_speed_hd=3
max_speed_hd_menu=30
slow_speed_hd_menu=5

max_speed_crt=6
slow_speed_crt=2
max_speed_crt_lobby=8
slow_speed_crt_lobby=2
max_speed_crt_menu=14
slow_speed_crt_menu=4

# Optional: stick deadzone (default 8000 for 16-bit axes, 15 for 8-bit)
# deadzone=8000
# deadzone_8bit=15

# Optional: match a specific pad by name substring
# device_match=
